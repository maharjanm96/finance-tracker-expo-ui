name: Build iOS (IPA & Simulator)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'ipa-device'
          - 'simulator'

jobs:
  build-ios:
    name: 🍏 Compile iOS App
    runs-on: macos-14

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🏗️ Run Expo Prebuild (Generate Native iOS Project)
        run: npx expo prebuild --platform ios --clean

      - name: 🔍 Detect Xcode Workspace and Scheme
        id: xcode-info
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Found workspace: $WORKSPACE"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          
          # Extract first scheme from the workspace
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | jq -r '.workspace.schemes[0]')
          echo "Detected scheme: $SCHEME"
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: 📱 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ─── 1. Build Physical Device Unsigned IPA (For Sideloadly / AltStore) ───
      - name: 🔨 Build Device Archive (Unsigned)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ipa-device' }}
        run: |
          WORKSPACE="${{ steps.xcode-info.outputs.workspace }}"
          SCHEME="${{ steps.xcode-info.outputs.scheme }}"
          
          echo "Building unsigned binary for physical devices..."
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Package into standard IPA structure (Payload folder)
          mkdir -p Payload
          APP_PATH=$(find build_device/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Copying $APP_PATH into Payload/"
          cp -r "$APP_PATH" Payload/
          zip -r -q finance-tracker-unsigned.ipa Payload
          echo "Successfully created finance-tracker-unsigned.ipa"

      - name: 📤 Upload Device IPA (Sideloadly / AltStore)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ipa-device' }}
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-unsigned-ipa
          path: finance-tracker-unsigned.ipa
          retention-days: 7

      # ─── 2. Build iOS Simulator App ───
      - name: 💻 Build Simulator App
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator' }}
        run: |
          WORKSPACE="${{ steps.xcode-info.outputs.workspace }}"
          SCHEME="${{ steps.xcode-info.outputs.scheme }}"
          
          echo "Building Simulator app..."
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build_sim \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Compress .app for download
          APP_PATH=$(find build_sim/Build/Products/Release-iphonesimulator -name "*.app" -type d | head -n 1)
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          zip -r -q "$GITHUB_WORKSPACE/finance-tracker-simulator.zip" "$APP_NAME"
          echo "Successfully created finance-tracker-simulator.zip"

      - name: 📤 Upload Simulator App
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-simulator-app
          path: finance-tracker-simulator.zip
          retention-days: 7
