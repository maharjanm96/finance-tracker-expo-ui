name: Build iOS (IPA & Simulator)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "ipa-device"
        type: choice
        options:
          - "all"
          - "ipa-device"
          - "simulator"

jobs:
  build-ios:
    name: Compile iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Detect workspace and scheme
        id: xcode-info
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          test -d ios/Pods || { echo "ios/Pods missing"; exit 1; }
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild -list -workspace "$WORKSPACE" | head -n 40
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      # Unsigned device build. Sideloadly re-signs it with your Apple ID.
      - name: Build device app (unsigned)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ipa-device' }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xcode-info.outputs.workspace }}" \
            -scheme "${{ steps.xcode-info.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build_device.log

          APP_PATH=$(find build_device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH" || { echo "No .app found"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q vectra-unsigned.ipa Payload
          ls -lh vectra-unsigned.ipa

      - name: Upload device IPA
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ipa-device' }}
        uses: actions/upload-artifact@v4
        with:
          name: vectra-unsigned-ipa
          path: vectra-unsigned.ipa
          retention-days: 7

      - name: Build simulator app
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator' }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xcode-info.outputs.workspace }}" \
            -scheme "${{ steps.xcode-info.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build_sim.log

          APP_PATH=$(find build_sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH" || { echo "No .app found"; exit 1; }
          (cd "$(dirname "$APP_PATH")" && zip -r -q "$GITHUB_WORKSPACE/vectra-simulator.zip" "$(basename "$APP_PATH")")

      - name: Upload simulator app
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: vectra-simulator-app
          path: vectra-simulator.zip
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_device.log
            build_sim.log
          if-no-files-found: ignore
